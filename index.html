<!DOCTYPE html>
<html>
  <head>
    <title>Blobby, but in 3D</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";

      // 1. The stage
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#fdf6ec');

      // 2. The camera
      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0.6, 6);
      camera.lookAt(0, -0.1, 0);

      // 3. The renderer
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // 4. Blobby: one sphere, sculpted into shape
      const geometry = new THREE.SphereGeometry(1, 128, 128);
      const points = geometry.attributes.position;

      for (let i = 0; i < points.count; i++) {
        const x = points.getX(i);
        const y = points.getY(i);
        const z = points.getZ(i);

        // The top half stays as a round dome
        if (y >= 0) continue;

        // How far down this point is: 0 = the middle, 1 = the very bottom
        const down = -y;

        // Which way this point faces around Blobby
        const around = Math.atan2(z, x);
        const sideways = Math.hypot(x, z) || 1;

        let width;
        let newY;

        if (down < 0.7) {
          // Straight sides
          width = 1;
          newY = -(down / 0.7) * 1.2;
        } else {
          // Rounded bottom with little legs
          const curve = ((down - 0.7) / 0.3) * Math.PI / 2;
          const leg = Math.abs(Math.cos(3 * (around - Math.PI / 2)));
          width = Math.cos(curve);
          newY = -1.2 - 0.2 * Math.sin(curve) - 0.4 * leg * Math.sin(2 * curve);
        }

        points.setXYZ(i, (x / sideways) * width, newY, (z / sideways) * width);
      }

      geometry.computeVertexNormals();

      // Remember Blobby's resting shape, so we can wobble away from it and back
      const restShape = points.array.slice();

      // A ghostly material: see-through, glowing from inside, soft at the edges
      const material = new THREE.MeshPhysicalMaterial({
        color: '#bfe3f7',
        transparent: true,
        opacity: 0.7,
        roughness: 0.35,
        emissive: '#bfe3f7',
        emissiveIntensity: 0.35,
        sheen: 1,
        sheenColor: '#ffffff',
        sheenRoughness: 0.4
      });

      const blobby = new THREE.Mesh(geometry, material);

      // A pivot point at Blobby's feet, so he squashes into the floor
      const character = new THREE.Group();
      character.position.y = -1.5;
      blobby.position.y = 1.8;
      character.add(blobby);
      scene.add(character);

      // 5. Blobby's face
      const face = new THREE.Group();
      blobby.add(face);

      const eyeMaterial = new THREE.MeshStandardMaterial({ color: '#2b3a4a', roughness: 0.4 });
      const sparkleMaterial = new THREE.MeshBasicMaterial({ color: 'white' });
      const cheekMaterial = new THREE.MeshStandardMaterial({ color: '#f7b6c8', transparent: true, opacity: 0.8 });

      // Finds the spot on Blobby's front surface for a given x,
      // and turns things to face outwards from there
      function placeOnFace(thing, x, y, outwards) {
        const z = Math.sqrt(1 - x * x);
        thing.position.set(x * (1 + outwards), y, z * (1 + outwards));
        thing.rotation.y = Math.asin(x);
        face.add(thing);
      }

      // Eyes: dark navy ovals pressed onto the surface
      const eyeShape = new THREE.SphereGeometry(0.13, 32, 32);
      const leftEye = new THREE.Mesh(eyeShape, eyeMaterial);
      leftEye.scale.set(1, 1.15, 0.45);
      placeOnFace(leftEye, -0.3, -0.1, 0);

      const rightEye = new THREE.Mesh(eyeShape, eyeMaterial);
      rightEye.scale.set(1, 1.15, 0.45);
      placeOnFace(rightEye, 0.3, -0.1, 0);

      // Sparkles: tiny white dots that make the eyes look alive
      const sparkleShape = new THREE.SphereGeometry(0.04, 16, 16);
      const leftSparkle = new THREE.Mesh(sparkleShape, sparkleMaterial);
      placeOnFace(leftSparkle, -0.26, -0.04, 0.05);

      const rightSparkle = new THREE.Mesh(sparkleShape, sparkleMaterial);
      placeOnFace(rightSparkle, 0.34, -0.04, 0.05);

      // Rosy cheeks: flat pink ovals
      const cheekShape = new THREE.SphereGeometry(0.12, 32, 32);
      const leftCheek = new THREE.Mesh(cheekShape, cheekMaterial);
      leftCheek.scale.set(1.3, 0.7, 0.2);
      placeOnFace(leftCheek, -0.55, -0.33, 0);

      const rightCheek = new THREE.Mesh(cheekShape, cheekMaterial);
      rightCheek.scale.set(1.3, 0.7, 0.2);
      placeOnFace(rightCheek, 0.55, -0.33, 0);

      // Smile: half a ring, flipped upside down so it curves up at the ends
      const smileShape = new THREE.TorusGeometry(0.1, 0.022, 16, 32, Math.PI);
      const smile = new THREE.Mesh(smileShape, eyeMaterial);
      placeOnFace(smile, 0, -0.27, 0);
      smile.rotation.z = Math.PI;

      // 6. The ghostly glow and the shadow

      // Draws a soft, fuzzy circle with code, to use like an image
      function makeSoftCircle(red, green, blue, strength) {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const paint = canvas.getContext('2d');
        const gradient = paint.createRadialGradient(128, 128, 0, 128, 128, 128);
        gradient.addColorStop(0, `rgba(${red}, ${green}, ${blue}, ${strength})`);
        gradient.addColorStop(1, `rgba(${red}, ${green}, ${blue}, 0)`);
        paint.fillStyle = gradient;
        paint.fillRect(0, 0, 256, 256);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      }

      // A soft blue halo behind Blobby
      const glow = new THREE.Sprite(new THREE.SpriteMaterial({
        map: makeSoftCircle(170, 220, 250, 0.7),
        depthWrite: false
      }));
      glow.scale.set(4.2, 4.6, 1);
      glow.position.set(0, 0.1, -1.2);
      scene.add(glow);

      // A soft shadow on the floor underneath him
      const shadow = new THREE.Mesh(
        new THREE.PlaneGeometry(2.6, 2.6),
        new THREE.MeshBasicMaterial({
          map: makeSoftCircle(70, 100, 130, 0.45),
          transparent: true,
          depthWrite: false
        })
      );
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = -1.55;
      scene.add(shadow);

      // 7. The lights
      const softLight = new THREE.AmbientLight('white', 1);
      const sunLight = new THREE.DirectionalLight('white', 2);
      sunLight.position.set(3, 4, 5);
      scene.add(softLight, sunLight);

      // 8. Make him jiggle like jelly
      // "lean" is extra sway, so his top can lag behind when he moves
      function jiggle(time, lean) {
        // How far the top of him sways, compared to his feet
        const swayX = Math.sin(time * 2.2) * 0.06 + lean;
        const swayZ = Math.cos(time * 1.7) * 0.03;

        for (let i = 0; i < points.count; i++) {
          const x = restShape[i * 3];
          const y = restShape[i * 3 + 1];
          const z = restShape[i * 3 + 2];

          // 0 at his feet, 1 at the top of his head
          const height = (y + 1.75) / 2.75;
          const bend = height * height;

          // A gentle ripple travelling up his body
          const ripple = 1 + Math.sin(time * 4 - y * 3) * 0.015;

          points.setXYZ(i, x * ripple + swayX * bend, y, z * ripple + swayZ * bend);
        }

        points.needsUpdate = true;
        geometry.computeVertexNormals();

        // Keep his face stuck to his body as it sways
        const faceBend = ((-0.1 + 1.75) / 2.75) ** 2;
        face.position.set(swayX * faceBend, 0, swayZ * faceBend);
      }

      // 9. Little helpers for the timeline

      // How far through a moment we are: 0 before it starts, 1 once it's over
      function progress(time, start, end) {
        return Math.min(Math.max((time - start) / (end - start), 0), 1);
      }

      // Slow, fast, slow: like ease-in-out in CSS
      function easeInOut(t) {
        return t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
      }

      // Blend between two numbers: t = 0 gives a, t = 1 gives b
      function blend(a, b, t) {
        return a + (b - a) * t;
      }

      // One hop, from start (0) to finish (1): crouch, jump, land, settle
      function hop(h) {
        let lift = 0;
        let squash = 0;

        if (h < 0.25) {
          // Crouch: squish down to gather energy
          squash = Math.sin((h / 0.25) * Math.PI / 2) * 0.18;
        } else if (h < 0.75) {
          // Jump: fly up, stretching tall
          const air = (h - 0.25) / 0.5;
          lift = Math.sin(air * Math.PI) * 0.7;
          squash = blend(0.18, -0.12, Math.min(air * 4, 1));
          if (air > 0.75) squash = blend(-0.12, 0, (air - 0.75) * 4);
        } else {
          // Land: squish into the floor, then settle
          squash = Math.sin(((h - 0.75) / 0.25) * Math.PI) * 0.16;
        }

        return { lift, squash };
      }

      // How far from the middle to the left edge of the screen
      function screenEdge() {
        const halfHeight = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
        return halfHeight * camera.aspect;
      }

      // 10. The show: runs about 60 times a second
      const clock = new THREE.Clock();

      renderer.setAnimationLoop(() => {
        const time = clock.getElapsedTime();
        const edge = -screenEdge();

        // Blobby's pose for this frame. Each part of the show changes these.
        let x = edge - 1.6;   // where he stands, left to right
        let tilt = 0;         // leaning sideways (negative = towards the right)
        let turn = 0;         // turning to face left or right
        let lift = 0;         // how high off the floor
        let squash = 0;       // squished down (positive) or stretched up (negative)
        let lean = 0;         // jelly lag: how far his top trails behind

        if (time < 3.4) {
          // Part 1: the peek. He slides out from behind the edge and leans in...
          const peek = easeInOut(progress(time, 0.8, 2.6));
          x = blend(edge - 1.6, edge - 0.2, peek);
          tilt = blend(0, -0.45, peek);
          turn = blend(0, 0.3, peek);

          // ...then a curious little head tilt: "hmm?"
          const curious = progress(time, 2.6, 3.4);
          tilt += Math.sin(curious * Math.PI) * 0.15;
        } else if (time < 4.2) {
          // Part 2: he straightens up, ready to step out
          const ready = easeInOut(progress(time, 3.4, 4.2));
          x = blend(edge - 0.2, edge + 0.4, ready);
          tilt = blend(-0.45, 0, ready);
          turn = blend(0.3, 0.35, ready);
          squash = Math.sin(ready * Math.PI) * 0.06;
        } else if (time < 8.6) {
          // Part 3: the squishy waddle to centre stage
          const walk = progress(time, 4.2, 8.6);
          x = blend(edge + 0.4, 0, easeInOut(walk));

          // Six steps. Each step goes: push off, bounce up, squish down on landing.
          const step = walk * 6;
          const bounce = Math.abs(Math.sin(step * Math.PI));
          lift = bounce * 0.12;
          squash = (1 - bounce) * 0.1 - bounce * 0.04;

          // Rock from foot to foot
          tilt = Math.sin(step * Math.PI) * 0.1;

          // Face the way he's walking, then turn back to us at the end
          turn = blend(0.35, 0, progress(time, 7.8, 8.6));

          // His wobbly top trails behind as he moves, like jelly
          const speed = 6 * walk * (1 - walk);
          lean = -speed * 0.12;
        } else if (time < 10.6) {
          // Part 4: two happy hops
          x = 0;
          const hops = progress(time, 8.6, 10.6) * 2;
          const pose = hop(hops % 1);
          lift = pose.lift;
          squash = pose.squash;
        } else if (time < 12.6) {
          // Part 5: the twirl, a full spin in 3D
          x = 0;
          const twirl = easeInOut(progress(time, 10.6, 12.6));
          turn = twirl * Math.PI * 2;
          lift = Math.sin(twirl * Math.PI) * 0.25;

          // As he spins, his soft top gets flung outwards
          lean = Math.sin(twirl * Math.PI) * 0.18;
          squash = -Math.sin(twirl * Math.PI) * 0.06;
                } else if (time < 19.6) {
          // Part 6: the waltz. He glides off to the right, turning slowly as he goes
          const waltz = progress(time, 12.6, 19.6);
          x = blend(0, -edge + 1.6, easeInOut(waltz));

          // Two slow, graceful turns while travelling, like real waltzers
          turn = easeInOut(waltz) * Math.PI * 4;

          // Four bars of waltz time: ONE-two-three, ONE-two-three...
          const bar = (waltz * 4) % 1;
          const beat = bar * 3;

          if (beat < 1) {
            // ONE: rise up and sweep forward
            lift = Math.sin(beat * Math.PI) * 0.18;
            tilt = -Math.sin(beat * Math.PI) * 0.15;
            squash = -Math.sin(beat * Math.PI) * 0.05;
          } else if (beat < 2) {
            // two: settle down softly
            squash = Math.sin((beat - 1) * Math.PI) * 0.06;
          } else {
            // three: a little lift, leaning back, ready for the next ONE
            lift = Math.sin((beat - 2) * Math.PI) * 0.06;
            tilt = Math.sin((beat - 2) * Math.PI) * 0.06;
          }

          // His soft top trails behind as he glides
          const speed = 6 * waltz * (1 - waltz);
          lean = -speed * 0.08;
        } else {
          // Part 7: he's gone! Wait just off the right edge
          x = -edge + 1.6;
        }

        // Breathing: a little taller, then a little wider
        const breath = Math.sin(time * 2) * 0.03;

        // Put Blobby in this frame's pose
        character.position.x = x;
        character.position.y = -1.5 + lift;
        character.rotation.z = tilt;
        character.rotation.y = turn;
        character.scale.set(1 + squash / 2 - breath / 2, 1 - squash + breath, 1 + squash / 2 - breath / 2);
        jiggle(time, lean);

        // The halo floats along behind him
        glow.position.x = x;
        glow.position.y = 0.1 + lift;

        // The shadow follows him, and shrinks when he's off the ground
        shadow.position.x = x;
        shadow.scale.setScalar(1 - breath - lift * 1.5);
        shadow.material.opacity = 1 - lift * 2;

        renderer.render(scene, camera);
      });

      // 11. Keep everything the right shape if the window changes size
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
